# Beispiel-Setup: Backup-Service + zwei typische Backup-Objekte.
# Die Labels an den Beispiel-Services zeigen die verfügbaren Optionen.

services:
  backup:
    build: .
    # image: oci.rohwer.sh/stack-backup:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Volume-Roots read-only und pfadidentisch mounten, damit restic die
      # Quellpfade der Container-Mounts sieht:
      - /mnt/docker-nfs-01/volumes:/mnt/docker-nfs-01/volumes:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
      # Lokales Backup-Ziel (Target "local"):
      - ./backups:/backups/local
      - ./config.yml:/etc/stack-backup/config.yml:ro
    secrets:
      - restic_local
      - restic_c2
    environment:
      C2_ACCESS_KEY: ${C2_ACCESS_KEY}
      C2_SECRET_KEY: ${C2_SECRET_KEY}
      # LOG_LEVEL: debug

  # Beispiel 1: SQLite-App — Container wird für ein konsistentes Backup
  # kurz gestoppt; der cache-Ordner wird ausgeschlossen.
  uptime-kuma:
    image: louislam/uptime-kuma:2
    volumes:
      - /mnt/docker-nfs-01/volumes/90-monitoring/uptime-kuma/data:/app/data
    labels:
      stack-backup.enable: "true"
      stack-backup.volumes: all
      stack-backup.stop: "true"
      stack-backup.volume./app/data.exclude: "cache/**,*.tmp"

  # Beispiel 2: Minecraft — konsistentes Backup ohne Stop über save-off/save-on.
  minecraft:
    image: itzg/minecraft-server
    environment:
      EULA: "true"
    volumes:
      - /mnt/docker-nfs-01/volumes/14-minecraft-java/creaking/data:/data
    labels:
      stack-backup.enable: "true"
      stack-backup.volumes: /data
      stack-backup.pre-command: "rcon-cli save-off && rcon-cli save-all"
      stack-backup.post-command: "rcon-cli save-on"
      stack-backup.volume./data.exclude: "logs/**,cache/**"

secrets:
  restic_local:
    file: ./secrets/restic_local
  restic_c2:
    file: ./secrets/restic_c2
